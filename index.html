<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview System</title>
    <link rel="stylesheet" href="css/styles.css">

    <meta name="referrer" content="no-referrer">
    <script src="vendor/js-yaml.min.js"></script>
    <script src="vendor/mustache.min.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/lz-string.min.js"></script>
    <script src="vendor/purify.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>PLDF document interview</h1><p>Answers stay in this tab until you explicitly export them. Reloading clears your progress.</p>
            <button id="reset-btn" class="reset-button">Reset Interview</button>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </header>

        <main>
            <div id="interview-container">
                <div id="question-area"></div>
                <div id="navigation">
                    <button id="prev-btn">Previous</button>
                    <button id="next-btn">Next</button>
                </div>
            </div>

            <div id="visualization-container" style="display: none;">
                <div id="mermaid-diagram"></div>
            </div>

            <div id="document-preview" style="display: none;">
                <div id="preview-content"></div>
                <div id="export-options">
                    <button id="download-md">Download Markdown</button>
                    <button id="download-html">Download HTML</button>
                    <button id="copy-url">Copy answer link</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Load application scripts -->
    <script src="js/definition-validator.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/state-manager.js"></script>
    <script src="js/template-processor.js"></script>

    <script src="js/interview-engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
